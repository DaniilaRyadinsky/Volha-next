host: localhost:8080
info:
  contact:
    email: help@breezy.su
    name: Alex "bustard" Provor
    url: https://breezy.su
  title: Volha gateway REST API
  version: "0.1"
paths:
  /api/article:
    delete:
      parameters:
      - description: ID статьи
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/view.MessageResponse'
      summary: Удалить статью и неиспользуемые файлы
      tags:
      - articles
    get:
      parameters:
      - description: ID статьи
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Article'
      summary: Получить статью
      tags:
      - articles
    post:
      consumes:
      - application/json
      parameters:
      - description: Статья; text содержит /pdfs/filename.pdf
        in: body
        name: article
        required: true
        schema:
          $ref: '#/definitions/domain.Article'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/view.IDResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Создать статью со ссылкой на загруженный PDF
      tags:
      - articles
    put:
      consumes:
      - application/json
      parameters:
      - description: Статья
        in: body
        name: article
        required: true
        schema:
          $ref: '#/definitions/domain.Article'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/view.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Обновить статью, сохранив время создания
      tags:
      - articles
  /api/article/all:
    get:
      parameters:
      - description: Страница с 1
        in: query
        name: page
        type: integer
      - description: Размер страницы, от 1 до 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ArticleList'
      summary: Получить список статей
      tags:
      - articles
  /api/auth/change-login:
    put:
      consumes:
      - application/json
      parameters:
      - description: Пароль и новый логин
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.changeLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/productsRPC.AuthUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Сменить логин
      tags:
      - auth
  /api/auth/change-password:
    put:
      consumes:
      - application/json
      parameters:
      - description: Текущий и новый пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.changePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/productsRPC.AuthUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Сменить пароль
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Access и refresh JWT устанавливаются в HttpOnly cookies и не возвращаются
        в JSON.
      parameters:
      - description: Учетные данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/productsRPC.AuthUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Вход по логину или email
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Refresh-сессия отзывается, access и refresh cookies очищаются.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/view.MessageResponse'
      summary: Завершить сессию
      tags:
      - auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/productsRPC.AuthUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Текущий пользователь
      tags:
      - auth
  /api/auth/refresh:
    post:
      description: Refresh token ротируется; новая пара JWT устанавливается в HttpOnly
        cookies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/productsRPC.AuthUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Обновить пару JWT токенов
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Access и refresh JWT устанавливаются в HttpOnly cookies и не возвращаются
        в JSON.
      parameters:
      - description: Данные пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/productsRPC.AuthUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /api/brand:
    delete:
      description: Удаляет бренд по ID
      parameters:
      - description: ID бренда
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: успех
          schema:
            $ref: '#/definitions/view.MessageResponse'
        "400":
          description: неправильный ввод
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "404":
          description: не найдено
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "502":
          description: ошибка в микросервисе
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Удалить бренд
      tags:
      - brands
    get:
      description: Возвращает бренд по id
      parameters:
      - description: ID бренда
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: успех
          schema:
            $ref: '#/definitions/domain.Brand'
        "502":
          description: ошибка в микросервисе
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Получить бренд
      tags:
      - brands
    post:
      consumes:
      - application/json
      description: Добавляет новый бренд
      parameters:
      - description: Данные нового бренда
        in: body
        name: brand
        required: true
        schema:
          $ref: '#/definitions/productsRPC.Brand'
      produces:
      - application/json
      responses:
        "200":
          description: успех
          schema:
            $ref: '#/definitions/view.IDResponse'
        "400":
          description: неправильный ввод
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "409":
          description: уже существует
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "502":
          description: ошибка в микросервисе
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Создать новый бренд
      tags:
      - brands
    put:
      consumes:
      - application/json
      description: Обновляет информацию о бренде по ID
      parameters:
      - description: Данные бренда
        in: body
        name: brand
        required: true
        schema:
          $ref: '#/definitions/productsRPC.Brand'
      produces:
      - application/json
      responses:
        "200":
          description: успех
          schema:
            $ref: '#/definitions/view.MessageResponse'
        "400":
          description: неправильный ввод
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "404":
          description: не найдено
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "502":
          description: ошибка в микросервисе
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Обновить бренд
      tags:
      - brands
  /api/brand/all:
    get:
      description: Возвращает список брендов
      produces:
      - application/json
      responses:
        "200":
          description: успех
          schema:
            items:
              $ref: '#/definitions/domain.Brand'
            type: array
        "502":
          description: ошибка в микросервисе
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Получить все бренды
      tags:
      - brands
  /api/cart:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/productsRPC.Cart'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Очистить корзину
      tags:
      - cart
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/productsRPC.Cart'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Получить корзину пользователя
      tags:
      - cart
  /api/cart/items:
    post:
      consumes:
      - application/json
      parameters:
      - description: Товар и количество
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.cartItemRequest'
      produces:
      - application/json
