        "200":
          description: OK
          schema:
            $ref: '#/definitions/productsRPC.Cart'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Добавить товар в корзину
      tags:
      - cart
  /api/cart/items/{product_id}:
    delete:
      parameters:
      - description: ID товара
        in: path
        name: product_id
        required: true
        type: string
      produces:
