      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/productsRPC.Cart'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/view.ErrorResponse'
      summary: Удалить товар из корзины
      tags:
      - cart
    put:
      consumes:
      - application/json
      parameters:
      - description: ID товара
        in: path
        name: product_id
        required: true
        type: string
      - description: Новое количество
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.cartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/productsRPC.Cart'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/view.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
