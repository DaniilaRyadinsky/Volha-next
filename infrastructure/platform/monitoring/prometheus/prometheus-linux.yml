global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["volha-gateway:9091"]

  - job_name: product-service
    metrics_path: /metrics
    static_configs:
      - targets: ["volha-product-service:9092"]

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["volha-auth-service:9093"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://volha-gateway:8080/health/live
          - http://volha-gateway:8080/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
