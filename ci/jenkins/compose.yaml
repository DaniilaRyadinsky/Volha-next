name: volha-ci

services:
  docker:
    image: docker:29.0.0-dind
    privileged: true
    command: ["--storage-driver=overlay2", "--insecure-registry=nexus:8082"]
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
      - docker-data:/var/lib/docker
    networks: [ci]
    restart: unless-stopped

  jenkins:
    build: .
    depends_on: [docker]
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - jenkins-data:/var/jenkins_home
      - docker-certs:/certs/client:ro
    networks: [ci]
    restart: unless-stopped

  sonar-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in ci/jenkins/.env}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db:/var/lib/postgresql
    networks: [ci]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in ci/jenkins/.env}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks: [ci]
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3:latest
    ports:
      - "127.0.0.1:8086:8081"
      - "127.0.0.1:8087:8082"
    volumes:
      - nexus-data:/nexus-data
    networks: [ci]
    restart: unless-stopped

networks:
  ci:

volumes:
  docker-certs:
  docker-data:
  jenkins-data:
  sonar-db:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  nexus-data:
