name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks - secrets in Git history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan history reachable from this commit
        run: |
          docker run --rm \
            --volume "$PWD:/repo" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . --log-opts=HEAD --redact --verbose

  semgrep:
    name: Semgrep CE - backend code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Go code
        run: |
          mkdir -p reports
          docker run --rm \
            --volume "$PWD:/src" --workdir /src \
            semgrep/semgrep:1.182.0 \
            semgrep scan --config p/golang \
            --metrics off --disable-version-check \
            --severity ERROR --error --strict \
            --exclude 'backend/api/proto/gen/**' \
            --exclude 'backend/docs/**' \
            --sarif-output reports/semgrep.sarif backend

      - name: Upload Semgrep report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-semgrep
          path: reports/semgrep.sarif
          if-no-files-found: warn
          retention-days: 14

  trivy:
    name: Trivy - backend dependencies and Dockerfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: backend
          scanners: vuln,misconfig
          format: json
          output: reports/trivy.json
          exit-code: '0'
          ignore-unfixed: false
          timeout: 10m

      - name: Fail on HIGH or CRITICAL findings
        run: trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 reports/trivy.json

      - name: Upload full Trivy report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-trivy
          path: reports/trivy.json
          if-no-files-found: warn
          retention-days: 14
